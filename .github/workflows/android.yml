name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Import complete KATOTTG catalog
        run: python3 scripts/prefetch_katottg.py
      - name: Cache Ukraine boundaries for offline map
        run: python3 scripts/prefetch_geojson.py
      - name: Compile simplified offline vector map
        run: python3 scripts/compile_offline_map.py
      - name: Run Kotlin unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TrivogaSimulator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
